[package]
name = "mixing-pal"
version = "0.2.13"
description = "A copilot for producers working in Ableton Live"
authors = ["Polina B <hello@mixingpal.com>"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mixing_pal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.11"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
# rustls rather than native-tls so the TLS stack is the same everywhere and
# the build does not depend on a system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-updater = "2"
# File analysis for get_sample. Only the codecs Live loads; no default
# features, so nothing else is compiled in.
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "aiff", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac"] }
rustfft = "6.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
wiremock = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }
minisign = "0.9"
base64 = "0.22"
flate2 = "1"
tar = "0.4"

[features]
direct-provider = []
# Exposes `bench_api` so `benches/` can reach the crate's private modules.
# Never enabled by the app build.
bench = []
# Exposes `eval_api` so `tests/evals.rs` can reach the crate's private
# modules. Never enabled by the app build, and gating the target on it is
# what keeps a plain `cargo test` off the network.
evals = []

[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]

[[bench]]
name = "round_trips"
harness = false
required-features = ["bench"]

[[bench]]
name = "sample_analysis"
harness = false
required-features = ["bench"]

[[test]]
name = "evals"
required-features = ["evals"]

[[test]]
name = "craft"
required-features = ["evals"]

[[test]]
name = "latency"
required-features = ["evals"]
